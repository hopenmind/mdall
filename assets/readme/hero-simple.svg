<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" width="920" height="250" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF8F4"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#3A2A12" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="920" height="250" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="918" height="248" rx="15" fill="none" stroke="#E8DCC4" stroke-width="1"/>

  <text x="460" y="40" font-size="21" font-weight="700" fill="#2A1F0F" text-anchor="middle">New here? It works in three simple steps.</text>
  <text x="460" y="64" font-size="13.5" fill="#9B8878" text-anchor="middle">No setup, no internet. Download one file, run it, and write or convert documents with live equations.</text>

  <!-- Card 1: Download -->
  <g filter="url(#soft)"><rect x="40" y="92" width="250" height="132" rx="14" fill="#FFFFFF" stroke="#E8DCC4" stroke-width="1.5"/></g>
  <circle cx="70" cy="120" r="15" fill="#C9920A"/>
  <text x="70" y="125" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <g stroke="#B07C08" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M254 110 v18"/><path d="M245 122 l9 8 l9 -8"/><path d="M243 136 h22"/>
  </g>
  <text x="165" y="170" font-size="15.5" font-weight="700" fill="#2A1F0F" text-anchor="middle">Download &amp; run</text>
  <text x="165" y="192" font-size="12" fill="#9B8878" text-anchor="middle">One file. No install,</text>
  <text x="165" y="208" font-size="12" fill="#9B8878" text-anchor="middle">nothing else to set up.</text>

  <path d="M303 158 h16 m-7 -6 l7 6 l-7 6" stroke="#C9920A" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Card 2: Write or open -->
  <g filter="url(#soft)"><rect x="335" y="92" width="250" height="132" rx="14" fill="#FFFFFF" stroke="#E8DCC4" stroke-width="1.5"/></g>
  <circle cx="365" cy="120" r="15" fill="#C9920A"/>
  <text x="365" y="125" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M538 108 h15 l7 7 v23 h-22 z" fill="#F4ECD6" stroke="#B07C08" stroke-width="2.3"/>
    <path d="M553 108 v7 h7" stroke="#B07C08" stroke-width="2.3"/>
    <path d="M556 133 l12 -12 l5 5 l-12 12 z" fill="#FFFFFF" stroke="#C9920A" stroke-width="2"/>
  </g>
  <text x="460" y="170" font-size="15.5" font-weight="700" fill="#2A1F0F" text-anchor="middle">Write or open a file</text>
  <text x="460" y="192" font-size="12" fill="#9B8878" text-anchor="middle">A live editor - your equations</text>
  <text x="460" y="208" font-size="12" fill="#9B8878" text-anchor="middle">render as you type.</text>

  <path d="M598 158 h16 m-7 -6 l7 6 l-7 6" stroke="#C9920A" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Card 3: Export & recover -->
  <g filter="url(#soft)"><rect x="630" y="92" width="250" height="132" rx="14" fill="#FFFFFF" stroke="#E8DCC4" stroke-width="1.5"/></g>
  <circle cx="660" cy="120" r="15" fill="#C9920A"/>
  <text x="660" y="125" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M832 106 h13 l6 6 v22 h-19 z" fill="#F4ECD6" stroke="#B07C08" stroke-width="2.3"/>
    <path d="M845 106 v6 h6" stroke="#B07C08" stroke-width="2.3"/>
    <path d="M849 121 h16 m-6 -5 l6 5 l-6 5" stroke="#C9920A" stroke-width="2.2"/>
    <path d="M865 133 h-16 m6 5 l-6 -5 l6 -5" stroke="#2D7A45" stroke-width="2.2"/>
  </g>
  <text x="755" y="170" font-size="15.5" font-weight="700" fill="#2A1F0F" text-anchor="middle">Export &amp; recover</text>
  <text x="755" y="192" font-size="12" fill="#9B8878" text-anchor="middle">PDF, Word, and back to</text>
  <text x="755" y="208" font-size="12" fill="#9B8878" text-anchor="middle">editable. Nothing is lost.</text>
</svg>
